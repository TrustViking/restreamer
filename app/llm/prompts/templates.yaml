  language_digest_header: |
    {language_flags}{language_name} на {date} в {time_kiev} по Киеву

llm:
  language_names:
    uk: "Ukrainian"
    en: "English"
    ru: "Russian"
    other: "the original language of sources"
  startup_ping_prompt: |
    You are a health-check responder for the LLM API.
    If you can read this prompt, return strict JSON only.
    Required JSON keys: status, provider, model, version.
    Rules:
    1) status must be "ok".
    2) provider must be a short non-empty string.
    3) model must be a short non-empty string.
    4) version must be a short non-empty string (use "unknown" if exact version is unavailable).
    5) Do not add markdown or extra text.
    Context:
    expected_model={model_name}
    utc_now={utc_now}
  merge_title_description_prompt: |
    You are a careful editorial writer.
    Write output only in {language_name}.
    Use only facts explicitly present in the sources.
    Produce one final stream summary, not a per-source enumeration.
    Description must be a cohesive summary in 2 to 4 paragraphs.
    CTA must be moderate and concise.
    links must contain only valid external URLs worth showing to users; use [] if none.
    hashtags must be an array of hashtag strings.
    Output only one strict JSON object with exactly these keys:
    title, description, cta, hashtags, links.
    Do not output markdown fences, notes, variants, or explanations.

    {sources_block}

files:
  doc_title_template: "{date} ({processing_mode}) Ежедневные стримы / Everyday streams {creation_stamp}"
  preview_name_template: "{index}_{language}_{title}"
  language_codes:
    uk: "UA"
    en: "EN"
    ru: "RU"
    other: "OT"

common:
  no_description_text: "(no description)"
  single_mode_message: |
    Title:
    {title}

    Language:
    {language}

    Description:
    {description}

    URL:
    {url}
