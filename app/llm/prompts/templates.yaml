    {form_url}

    {symbol_description} Описание / Description
    {generated_doc_url}
  language_block: |
    {date_display} на {time_kiev} по Киеву

    {symbol_pin}Название и описание эфира {language_flags}
    Name and description of stream

    {title}

    {description}
  language_merged_block: |
    {date_display} на {time_kiev} по Киеву

    {symbol_pin}Название и описание эфира {language_flags}
    Name and description of stream

    {title}

    {description}
  key_form_reminder: |
    📌📌📌 Форма для ключей 🔑 ( Key registration form) 📍
    {form_url}
  sparkle_separator: |
    ✨✨✨✨✨✨✨
  post_header: |
