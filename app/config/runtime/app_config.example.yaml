# Template config: copy this file to app/config/runtime/app_config.yaml and fill real values.
# app/config/runtime/app_config.example.yaml should stay free of environment-specific secrets/ids.
# Environment toggles (.env):
# RESTREAMER_LOGGER_NAME=restreamer
# TELEGRAM_BOT_TOKEN=
# TELEGRAM_CHAT_ID=
# GPT_API_KEY=sk-proj-
# OPENAI_ADMIN_KEY=sk-admin-
# OPENAI_PROJECT_ID=proj_
# GOOGLE_SERVICE_ACCOUNT_PATH=
# GOOGLE_AUTH_MODE=oauth
# GOOGLE_OAUTH_CREDENTIALS_PATH=secrets/credentials.json
# GOOGLE_OAUTH_TOKEN_PATH=secrets/token.json
# GOOGLE_DRIVE_FOLDER_ID=
# GOOGLE_DRIVE_PREVIEW_FOLDER_ID=
# GOOGLE_SHEETS_ID=
# LOG_DIR=logs
# APP_CONFIG_PATH=app/config/runtime/app_config.yaml
# STG_SHEETS_LINK_WRITEBACK=True
# STG_STRIP_CHAPTER_TIMESTAMPS=True
# OPENAI_MODEL=gpt-5.1
# STG_OPENAI_TIMEOUT_SEC=600
# STG_OPENAI_MAX_OUTPUT_TOKENS=3000
# STG_OPENAI_PRE_DELAY_SEC=5
# STG_CLEANUP_MAX_AGE_DAYS=3
# OPENAI_USAGE_MODELS=gpt-5.1
# OPENAI_USAGE_TIMEOUT_SEC=30
# OPENAI_USAGE_VERBOSE_LOG=1
app:
  processing:
    mode: audit

  google:
    enabled: true
    drive_preview_path_template: "{restreamer}/{preview}/{language}/{date}"
    doc_share_mode: anyone_writer
    sheets_range: "A:D"
    form_url: "https://forms.gle/REPLACE_ME"
    contacts: "@contact1 @contact2"

  paths:
    local_image_dir_template: "./image/{date}/{language}"
    local_doc_dir_template: "./docs/{date}"

  timezones:
    kiev: "Europe/Kyiv"
    cet: "Europe/Berlin"

  telegram:
    enabled: true
    use_audit: false
    symbol_separator: "🎬"
    separator_repeat_count: 8
    symbol_separator_start: "🔵"
    separator_start_repeat_count: 12
    symbol_broadcast: "❇️"
    symbol_alert: "🚨"
    symbol_form: "❇️"
    symbol_description: "❇️"
    symbol_pin: "📌"
    symbol_done: "✅"
    flag_repeat_count: 3
    send_delay_seconds: 1.0
    max_retries: 3

  files:
    preview_filename_max_stem: 120
