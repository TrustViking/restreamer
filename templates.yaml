llm:
  language_names:
    uk: "Ukrainian"
    en: "English"
    ru: "Russian"
    other: "the original language of sources"
  startup_ping_prompt: |
    You are a health-check responder for the LLM API.
    If you can read this prompt, return strict JSON only.
    Required JSON keys: status, provider, model, version.
    Rules:
    1) status must be "ok".
    2) provider must be a short non-empty string.
    3) model must be a short non-empty string.
    4) version must be a short non-empty string (use "unknown" if exact version is unavailable).
    5) Do not add markdown or extra text.
    Context:
    expected_model={model_name}
    utc_now={utc_now}
  merge_title_description_prompt: |
    You are a strict YouTube editor.
    Write output only in {language_name}.
    Task: Merge all source videos into one title and one description.
    Rules:
    1) Keep factual details from sources and do not invent facts.
    2) merged_title must be concise, 1..98 chars, no emoji.
    3) If there are N source descriptions, DESCRIPTION must contain exactly N paragraphs in the same source order.
    4) Paragraph i must summarize source i only (same order), preserving factual anchors from that source.
    5) Do not mix facts across sources, do not use markdown, and do not use code fences.
    6) Return plain text exactly in this format:
    TITLE: <merged title>
    DESCRIPTION: <paragraph 1 for source 1>

    <paragraph 2 for source 2>
    ...
    <paragraph N for source N>
    <CTA line without prefix>
    <HASHTAGS line without prefix, space-separated hashtags>
    <source_url_1>
    <source_url_2>
    ...
    <source_url_N>
    7) Do not print labels "CTA:", "HASHTAGS:", "SOURCES:".
    8) Output only these blocks, no explanations before or after.

    {sources_block}

files:
  doc_title_template: "{date} ({processing_mode}) Ежедневные стримы / Everyday streams {creation_stamp}"
  preview_name_template: "{index}_{language}_{title}"
  language_codes:
    uk: "UA"
    en: "EN"
    ru: "RU"
    other: "OT"

common:
  no_description_text: "(no description)"
  single_mode_message: |
    Title:
    {title}

    Language:
    {language}

    Description:
    {description}

    URL:
    {url}
